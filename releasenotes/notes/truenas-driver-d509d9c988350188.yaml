---
features:
  - |
    Added a new volume driver for TrueNAS SCALE storage systems,
    ``cinder.volume.drivers.truenas.driver.TrueNASDriver``. The driver
    provisions each Cinder volume as a ZFS zvol exported over iSCSI, driving
    the TrueNAS WebSocket JSON-RPC API; all host-side attach, detach, and
    multipath handling is performed by ``os-brick``.

    Supported operations: create and delete volume, attach and detach,
    extend, create and delete snapshot, revert volume to snapshot, create
    volume from snapshot, clone volume, retype, thin provisioning,
    multipath, and multiattach.

    The driver needs the ``websocket-client`` package (1.3.2 or later) in the
    environment that runs ``cinder-volume``. If it is missing, the driver
    fails ``check_for_setup_error`` with an actionable message.

    The driver logs in with a TrueNAS API key. With TrueNAS 26 or later,
    ``truenas_auth_mechanism = SCRAM`` logs in without sending the key and
    binds the login to TrueNAS's TLS certificate.

    The iSCSI base name (IQN prefix) and portal ports are read from TrueNAS,
    so Cinder's generic ``target_prefix`` option is not used.

    To enable the driver, add a backend stanza to ``cinder.conf`` and list it
    in ``enabled_backends``::

        [truenas]
        volume_driver = cinder.volume.drivers.truenas.driver.TrueNASDriver
        volume_backend_name = truenas
        truenas_ip = truenas.example.com
        truenas_login = truenas_admin
        truenas_api_key = <api-key>
        truenas_pool = tank
        truenas_dataset_root = cinder
        truenas_iscsi_portal_id = 1
