# The data plane: rhoso-compute-0, a pre-provisioned RHEL 9.6 Hyper-V VM at
# 192.168.122.100, built by kickstart.py and already registered. Needs the
# secrets from make-dataplane-secrets.sh. Its one NIC carries ctlplane
# untagged and internalapi, storage and tenant as VLANs 20-22, like the CRC
# node's; os-net-config moves the ctlplane address onto br-ex.
#
# No "redhat" service (the node is registered) and no telemetry (disabled in
# the control plane); bootstrap only pins the release and enables the repos.
# download-cache installs ceph-common even without Ceph, hence rhceph-7-tools.
---
apiVersion: dataplane.openstack.org/v1beta1
kind: OpenStackDataPlaneNodeSet
metadata:
  name: compute
  namespace: openstack
spec:
  preProvisioned: true
  tlsEnabled: true
  networkAttachments: [ctlplane]
  env:
    - {name: ANSIBLE_FORCE_COLOR, value: "True"}
  services:
    - bootstrap
    - download-cache
    - configure-network
    - validate-network
    - install-os
    - configure-os
    - ssh-known-hosts
    - run-os
    - reboot-os
    - install-certs
    - ovn
    - neutron-metadata
    - libvirt
    - nova
  nodeTemplate:
    ansibleSSHPrivateKeySecret: dataplane-ansible-ssh-private-key-secret
    ansible:
      ansibleUser: cloud-admin
      ansiblePort: 22
      ansibleVarsFrom:
        - secretRef: {name: redhat-registry}
      ansibleVars:
        edpm_bootstrap_command: |
          set -e
          subscription-manager release --set=9.6
          subscription-manager repos --disable='*' \
            --enable=rhel-9-for-x86_64-baseos-eus-rpms \
            --enable=rhel-9-for-x86_64-appstream-eus-rpms \
            --enable=rhel-9-for-x86_64-highavailability-eus-rpms \
            --enable=fast-datapath-for-rhel-9-x86_64-rpms \
            --enable=rhoso-18.0-for-rhel-9-x86_64-rpms \
            --enable=rhceph-7-tools-for-rhel-9-x86_64-rpms
        timesync_ntp_servers:
          - {hostname: pool.ntp.org}
        edpm_sshd_allowed_ranges: [192.168.122.0/24]
        edpm_nodes_validation_validate_controllers_icmp: false
        edpm_nodes_validation_validate_gateway_icmp: false
        neutron_physical_bridge_name: br-ex
        neutron_public_interface_name: eth0
        edpm_network_config_template: |
          ---
          {% set mtu_list = [ctlplane_mtu] %}
          {% for network in nodeset_networks %}
          {{ mtu_list.append(lookup('vars', networks_lower[network] ~ '_mtu')) }}
          {%- endfor %}
          {% set min_viable_mtu = mtu_list | max %}
          network_config:
          - type: ovs_bridge
            name: {{ neutron_physical_bridge_name }}
            mtu: {{ min_viable_mtu }}
            use_dhcp: false
            dns_servers: {{ ctlplane_dns_nameservers }}
            domain: {{ dns_search_domains }}
            addresses:
            - ip_netmask: {{ ctlplane_ip }}/{{ ctlplane_cidr }}
            routes: {{ ctlplane_host_routes }}
            members:
            - type: interface
              name: nic1
              mtu: {{ min_viable_mtu }}
              primary: true
          {% for network in nodeset_networks %}
            - type: vlan
              mtu: {{ lookup('vars', networks_lower[network] ~ '_mtu') }}
              vlan_id: {{ lookup('vars', networks_lower[network] ~ '_vlan_id') }}
              addresses:
              - ip_netmask:
                  {{ lookup('vars', networks_lower[network] ~ '_ip') }}/{{ lookup('vars', networks_lower[network] ~ '_cidr') }}
              routes: {{ lookup('vars', networks_lower[network] ~ '_host_routes') }}
          {% endfor %}
  nodes:
    edpm-compute-0:
      hostName: edpm-compute-0
      ansible:
        ansibleHost: 192.168.122.100
      networks:
        - {name: ctlplane, subnetName: subnet1, defaultRoute: true, fixedIP: 192.168.122.100}
        - {name: internalapi, subnetName: subnet1}
        - {name: storage, subnetName: subnet1}
        - {name: tenant, subnetName: subnet1}
---
apiVersion: dataplane.openstack.org/v1beta1
kind: OpenStackDataPlaneDeployment
metadata:
  name: compute-1
  namespace: openstack
spec:
  nodeSets: [compute]
