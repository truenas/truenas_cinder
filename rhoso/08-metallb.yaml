# Service VIPs on each network (.80-.90), announced by ARP on that network's
# interface only; never on tap0/br-ex. Fixed VIPs used by the control plane:
# DNS 192.168.122.80, internal APIs 172.17.0.80, RabbitMQ 172.17.0.85/.86.
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata: {name: ctlplane, namespace: metallb-system}
spec: {addresses: [192.168.122.80-192.168.122.90]}
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata: {name: internalapi, namespace: metallb-system}
spec: {addresses: [172.17.0.80-172.17.0.90]}
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata: {name: storage, namespace: metallb-system}
spec: {addresses: [172.18.0.80-172.18.0.90]}
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata: {name: tenant, namespace: metallb-system}
spec: {addresses: [172.19.0.80-172.19.0.90]}
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata: {name: ctlplane, namespace: metallb-system}
spec: {ipAddressPools: [ctlplane], interfaces: [ospbr]}
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata: {name: internalapi, namespace: metallb-system}
spec: {ipAddressPools: [internalapi], interfaces: [eth0.20]}
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata: {name: storage, namespace: metallb-system}
spec: {ipAddressPools: [storage], interfaces: [eth0.21]}
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata: {name: tenant, namespace: metallb-system}
spec: {ipAddressPools: [tenant], interfaces: [eth0.22]}
