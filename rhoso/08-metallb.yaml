# Service VIPs on each network (the *_VIP_RANGE settings), announced by ARP
# on that network's interface only. The control plane pins these from the
# ranges: DNS_VIP on ctlplane, and INTERNALAPI_VIP (shared by the internal
# API endpoints), RABBITMQ_VIP and RABBITMQ_CELL1_VIP on internalapi.
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata: {name: ctlplane, namespace: metallb-system}
spec: {addresses: [${CTLPLANE_VIP_RANGE}]}
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata: {name: internalapi, namespace: metallb-system}
spec: {addresses: [${INTERNALAPI_VIP_RANGE}]}
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata: {name: storage, namespace: metallb-system}
spec: {addresses: [${STORAGE_VIP_RANGE}]}
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata: {name: tenant, namespace: metallb-system}
spec: {addresses: [${TENANT_VIP_RANGE}]}
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata: {name: ctlplane, namespace: metallb-system}
spec: {ipAddressPools: [ctlplane], interfaces: [ospbr]}
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata: {name: internalapi, namespace: metallb-system}
spec: {ipAddressPools: [internalapi], interfaces: [${OCP_NODE_NIC}.${INTERNALAPI_VLAN}]}
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata: {name: storage, namespace: metallb-system}
spec: {ipAddressPools: [storage], interfaces: [${OCP_NODE_NIC}.${STORAGE_VLAN}]}
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata: {name: tenant, namespace: metallb-system}
spec: {ipAddressPools: [tenant], interfaces: [${OCP_NODE_NIC}.${TENANT_VLAN}]}
