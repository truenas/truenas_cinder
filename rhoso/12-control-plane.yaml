# A minimal RHOSO 18 control plane for one CRC node: one replica of
# everything, and only the services that Red Hat's cinder certification
# suite needs: Keystone, Glance, Cinder, Nova, Neutron, Placement, and
# Barbican for the encrypted-volume tests. Cinder has two TrueNAS backends,
# "truenas" and "truenas2" (separate dataset roots, so volumes can migrate
# between them), and backs up to an NFS share on TrueNAS.
# Needs osp-secret and cinder-volume-truenas-secrets (make-secrets.sh) and
# the OpenStackVersion in 11-openstack-version.yaml for the backends' image.
#
# The internal API endpoints share the MetalLB VIP INTERNALAPI_VIP. In the
# OpenShift Local lab, TrueNAS is on none of the RHOSO networks: the node
# reaches it by the host route in 06-nncp.yaml.
apiVersion: core.openstack.org/v1beta1
kind: OpenStackControlPlane
metadata:
  name: openstack
  namespace: openstack
spec:
  secret: osp-secret
  storageClass: ${STORAGE_CLASS}

  dns:
    template:
      replicas: 1
      options:
        - {key: server, values: [${DNS_SERVER_1}]}
        - {key: server, values: [${DNS_SERVER_2}]}
      override:
        service:
          metadata:
            annotations:
              metallb.universe.tf/address-pool: ctlplane
              metallb.universe.tf/allow-shared-ip: ctlplane
              metallb.universe.tf/loadBalancerIPs: ${DNS_VIP}
          spec: {type: LoadBalancer}

  galera:
    templates:
      openstack: {replicas: 1, secret: osp-secret, storageRequest: 5Gi}
      openstack-cell1: {replicas: 1, secret: osp-secret, storageRequest: 5Gi}

  memcached:
    templates:
      memcached: {replicas: 1}

  rabbitmq:
    templates:
      rabbitmq:
        replicas: 1
        override:
          service:
            metadata:
              annotations:
                metallb.universe.tf/address-pool: internalapi
                metallb.universe.tf/loadBalancerIPs: ${RABBITMQ_VIP}
            spec: {type: LoadBalancer}
      rabbitmq-cell1:
        replicas: 1
        override:
          service:
            metadata:
              annotations:
                metallb.universe.tf/address-pool: internalapi
                metallb.universe.tf/loadBalancerIPs: ${RABBITMQ_CELL1_VIP}
            spec: {type: LoadBalancer}

  keystone:
    apiOverride: {route: {}}
    template:
      replicas: 1
      databaseInstance: openstack
      secret: osp-secret
      override:
        service:
          internal: &internal-vip
            metadata:
              annotations:
                metallb.universe.tf/address-pool: internalapi
                metallb.universe.tf/allow-shared-ip: internalapi
                metallb.universe.tf/loadBalancerIPs: ${INTERNALAPI_VIP}
            spec: {type: LoadBalancer}

  placement:
    apiOverride: {route: {}}
    template:
      replicas: 1
      databaseInstance: openstack
      secret: osp-secret
      override:
        service:
          internal: *internal-vip

  glance:
    apiOverrides:
      default: {route: {}}
    template:
      databaseInstance: openstack
      secret: osp-secret
      keystoneEndpoint: default
      storage: {storageRequest: 20G}
      customServiceConfig: |
        [DEFAULT]
        enabled_backends = default_backend:file
        [glance_store]
        default_backend = default_backend
        [default_backend]
        filesystem_store_datadir = /var/lib/glance/images/
      glanceAPIs:
        default:
          type: single
          replicas: 1
          networkAttachments: [storage]
          override:
            service:
              internal: *internal-vip

  cinder:
    apiOverride: {route: {}}
    template:
      databaseInstance: openstack
      secret: osp-secret
      cinderAPI:
        replicas: 1
        override:
          service:
            internal: *internal-vip
      cinderScheduler: {replicas: 1}
      # Backups go to an NFS share on TrueNAS (TRUENAS_BACKUP_PATH), which
      # must allow the address TrueNAS sees the cluster's nodes as.
      # cinderBackup is deprecated in favor of cinderBackups, but this
      # operator (v1.22) still defaults cinderBackup and then rejects the two
      # together, so it has to stay for now.
      cinderBackup:
        replicas: 1
        networkAttachments: [storage]
        customServiceConfig: |
          [DEFAULT]
          backup_driver = cinder.backup.drivers.nfs.NFSBackupDriver
          backup_share = ${TRUENAS_IP}:${TRUENAS_BACKUP_PATH}
          backup_mount_options = vers=4.1
      cinderVolumes:
        truenas:
          replicas: 1
          networkAttachments: [storage]
          customServiceConfig: |
            [DEFAULT]
            enabled_backends = truenas
            [truenas]
            volume_backend_name = truenas
            volume_driver = cinder.volume.drivers.truenas.driver.TrueNASDriver
            truenas_ip = ${TRUENAS_IP}
            truenas_verify_ssl = ${TRUENAS_VERIFY_SSL}
            truenas_pool = ${TRUENAS_POOL}
            truenas_dataset_root = ${TRUENAS_DATASET_ROOT}
            truenas_iscsi_portal_id = ${TRUENAS_PORTAL_ID}
          customServiceConfigSecrets:
            - cinder-volume-truenas-secrets
        truenas2:
          replicas: 1
          networkAttachments: [storage]
          customServiceConfig: |
            [DEFAULT]
            enabled_backends = truenas2
            [truenas2]
            volume_backend_name = truenas2
            volume_driver = cinder.volume.drivers.truenas.driver.TrueNASDriver
            truenas_ip = ${TRUENAS_IP}
            truenas_verify_ssl = ${TRUENAS_VERIFY_SSL}
            truenas_pool = ${TRUENAS_POOL}
            truenas_dataset_root = ${TRUENAS_DATASET_ROOT_2}
            truenas_iscsi_portal_id = ${TRUENAS_PORTAL_ID}
          customServiceConfigSecrets:
            - cinder-volume-truenas-secrets

  neutron:
    apiOverride: {route: {}}
    template:
      replicas: 1
      databaseInstance: openstack
      secret: osp-secret
      networkAttachments: [internalapi]
      override:
        service:
          internal: *internal-vip

  ovn:
    template:
      ovnDBCluster:
        ovndbcluster-nb:
          dbType: NB
          replicas: 1
          storageRequest: 5G
          networkAttachment: internalapi
        ovndbcluster-sb:
          dbType: SB
          replicas: 1
          storageRequest: 5G
          networkAttachment: internalapi
      ovnNorthd: {replicas: 1}

  nova:
    apiOverride: {route: {}}
    template:
      secret: osp-secret
      apiServiceTemplate:
        replicas: 1
        # True with a single compute node: the certification suite's resize
        # tests then resize onto the same host.
        customServiceConfig: |
          [DEFAULT]
          allow_resize_to_same_host = ${NOVA_ALLOW_RESIZE_TO_SAME_HOST}
        override:
          service:
            internal: *internal-vip
      metadataServiceTemplate:
        replicas: 1
        override:
          service:
            internal: *internal-vip
      schedulerServiceTemplate: {replicas: 1}
      cellTemplates:
        cell0:
          cellDatabaseAccount: nova-cell0
          cellDatabaseInstance: openstack
          cellMessageBusInstance: rabbitmq
          hasAPIAccess: true
        cell1:
          cellDatabaseAccount: nova-cell1
          cellDatabaseInstance: openstack-cell1
          cellMessageBusInstance: rabbitmq-cell1
          hasAPIAccess: true
          noVNCProxyServiceTemplate:
            enabled: true
            networkAttachments: [ctlplane]

  barbican:
    enabled: true
    apiOverride: {route: {}}
    template:
      databaseInstance: openstack
      secret: osp-secret
      barbicanAPI:
        replicas: 1
        override:
          service:
            internal: *internal-vip
      barbicanWorker: {replicas: 1}
      barbicanKeystoneListener: {replicas: 1}

  designate: {enabled: false}
  heat: {enabled: false}
  horizon: {enabled: false}
  ironic: {enabled: false}
  manila: {enabled: false}
  octavia: {enabled: false}
  redis: {enabled: false}
  swift: {enabled: false}
  telemetry: {enabled: false}
  watcher: {enabled: false}
