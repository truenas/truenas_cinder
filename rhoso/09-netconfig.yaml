# RHOSO's IP allocation for data plane nodes on each network, from the
# *_EDPM_RANGES settings. Each compute's ctlplane address is fixed in
# 13-data-plane.yaml and must be inside CTLPLANE_EDPM_RANGES.
apiVersion: network.openstack.org/v1beta1
kind: NetConfig
metadata:
  name: netconfig
  namespace: openstack
spec:
  networks:
    - name: ctlplane
      dnsDomain: ctlplane.example.com
      subnets:
        - name: subnet1
          cidr: ${CTLPLANE_CIDR}
          gateway: ${CTLPLANE_GATEWAY}
          allocationRanges: ${CTLPLANE_EDPM_RANGES}
    - name: internalapi
      dnsDomain: internalapi.example.com
      subnets:
        - name: subnet1
          cidr: ${INTERNALAPI_CIDR}
          vlan: ${INTERNALAPI_VLAN}
          allocationRanges: ${INTERNALAPI_EDPM_RANGES}
    - name: storage
      dnsDomain: storage.example.com
      subnets:
        - name: subnet1
          cidr: ${STORAGE_CIDR}
          vlan: ${STORAGE_VLAN}
          allocationRanges: ${STORAGE_EDPM_RANGES}
    - name: tenant
      dnsDomain: tenant.example.com
      subnets:
        - name: subnet1
          cidr: ${TENANT_CIDR}
          vlan: ${TENANT_VLAN}
          allocationRanges: ${TENANT_EDPM_RANGES}
