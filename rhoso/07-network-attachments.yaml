# Pod attachments to the isolated networks (install_yamls layout): pods get
# addresses on each network from whereabouts, in the *_POD_RANGE settings.
# `datacentre` is the OVN physnet bridge mapping; it must exist before the
# control plane, so ovn-operator reuses it instead of creating a host-device
# attachment that would move ospbr into the ovn-controller pod.
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: ctlplane
  namespace: openstack
spec:
  config: |
    {"cniVersion": "0.3.1", "name": "ctlplane", "type": "macvlan",
     "master": "ospbr",
     "ipam": {"type": "whereabouts", "range": "${CTLPLANE_CIDR}",
              "range_start": "${CTLPLANE_POD_RANGE_START}", "range_end": "${CTLPLANE_POD_RANGE_END}"}}
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: internalapi
  namespace: openstack
spec:
  config: |
    {"cniVersion": "0.3.1", "name": "internalapi", "type": "macvlan",
     "master": "${OCP_NODE_NIC}.${INTERNALAPI_VLAN}",
     "ipam": {"type": "whereabouts", "range": "${INTERNALAPI_CIDR}",
              "range_start": "${INTERNALAPI_POD_RANGE_START}", "range_end": "${INTERNALAPI_POD_RANGE_END}"}}
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: storage
  namespace: openstack
spec:
  config: |
    {"cniVersion": "0.3.1", "name": "storage", "type": "macvlan",
     "master": "${OCP_NODE_NIC}.${STORAGE_VLAN}",
     "ipam": {"type": "whereabouts", "range": "${STORAGE_CIDR}",
              "range_start": "${STORAGE_POD_RANGE_START}", "range_end": "${STORAGE_POD_RANGE_END}"}}
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: tenant
  namespace: openstack
spec:
  config: |
    {"cniVersion": "0.3.1", "name": "tenant", "type": "macvlan",
     "master": "${OCP_NODE_NIC}.${TENANT_VLAN}",
     "ipam": {"type": "whereabouts", "range": "${TENANT_CIDR}",
              "range_start": "${TENANT_POD_RANGE_START}", "range_end": "${TENANT_POD_RANGE_END}"}}
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: datacentre
  namespace: openstack
spec:
  config: |
    {"cniVersion": "0.3.1", "name": "datacentre", "type": "bridge",
     "bridge": "ospbr", "ipam": {}}
